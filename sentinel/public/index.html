<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SENTINEL · OSINT Fusion</title>
  <meta name="description" content="Real-time open-source intelligence board: chokepoints, military aviation, shipping, conflict reporting, hazards, cyber and markets.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 30 16 16 30 2 16z' fill='none' stroke='%2346c2ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2346c2ff'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="glyph">◈</span> SENTINEL <span class="sub">OSINT FUSION</span></div>
    <button class="gti" id="gti" title="Global Threat Index — mean of the five highest-scoring theatres">
      <span class="gti-label">GLOBAL THREAT</span>
      <span class="gti-val" id="gtiVal">--</span>
      <span class="lvl" id="gtiLvl">NO DATA</span>
      <svg class="gti-spark" id="gtiSpark" viewBox="0 0 120 26" preserveAspectRatio="none"></svg>
    </button>
    <div class="counters" id="counters"></div>
    <div class="clock"><span id="clock">--:--:--</span><span class="z">UTC</span></div>
    <div class="live" id="live"><span class="dot"></span><span id="liveTxt">CONNECTING</span></div>
  </header>
  <div class="demo-banner" id="demoBanner" hidden>DEMO DATA — synthetic values for offline development. Run <code>npm start</code> without <code>--demo</code> for live OSINT feeds.</div>

  <main class="layout">
    <aside class="rail" id="rail">
      <section>
        <h3>Layers</h3>
        <div id="layers"></div>
      </section>
      <section>
        <h3>Risk levels</h3>
        <div class="legend" id="riskLegend"></div>
      </section>
      <section>
        <h3>Sources <span class="muted" id="srcCount"></span></h3>
        <div id="sources" class="sources"></div>
      </section>
    </aside>

    <div class="mapwrap">
      <div class="viewport" id="viewport">
        <div id="map"></div>
        <div id="globe" hidden></div>
      </div>
      <div class="fx-overlay" id="fxOverlay" aria-hidden="true"></div>
      <div class="hud" aria-hidden="true">
        <div class="hud-corner tl"></div><div class="hud-corner tr"></div><div class="hud-corner bl"></div><div class="hud-corner br"></div>
        <div class="hud-reticle"><span></span></div>
        <div class="hud-tl"><span class="rec">● REC</span> <span id="hudMode">STANDARD EO</span><br><span class="dim">SENTINEL // OSINT FUSION // UNCLASSIFIED</span></div>
        <div class="hud-tr"><span id="hudTime">—</span><br><span class="dim" id="hudAlt">—</span></div>
        <div class="hud-bl"><span class="dim">CURSOR</span> <span id="hudCursor">—</span></div>
        <div class="hud-br"><span class="dim">SRC</span> PUBLIC OPEN SOURCES ONLY</div>
      </div>
      <div class="viewctl">
        <div class="seg"><button data-view="globe">3D GLOBE</button><button data-view="map">2D MAP</button></div>
        <label class="fxpick"><span>MODE</span><select id="fxSel" aria-label="Visual mode"></select></label>
        <label class="fxpick"><span>IMAGERY</span><select id="imgSel" aria-label="Imagery"></select></label>
        <span class="datewrap" id="imgDateWrap" hidden><button class="tbtn" id="imgPrev" title="Previous day">‹</button><input type="date" id="imgDate" aria-label="Imagery date"><button class="tbtn" id="imgNext" title="Next day">›</button></span>
        <button id="rotBtn" class="tbtn" title="Auto-rotate">⟳</button>
        <button id="hudBtn" class="tbtn on" title="Toggle HUD">HUD</button>
      </div>
      <div class="lens-legend" id="lensLegend"></div>
      <div class="hover-card" id="hoverCard" hidden></div>
      <div class="toast" id="toast" hidden></div>
      <button class="rail-toggle" id="railToggle" aria-label="Toggle layers panel">☰</button>
    </div>

    <aside class="panel" id="panel">
      <nav class="tabs" id="tabs" role="tablist">
        <button data-tab="brief" class="on">Brief</button>
        <button data-tab="live">Live</button>
        <button data-tab="geo">Geo</button>
        <button data-tab="orbits">Orbits</button>
        <button data-tab="choke">Chokepoints</button>
        <button data-tab="theatres">Theatres</button>
        <button data-tab="markets">Markets</button>
        <button data-tab="params">Parameters</button>
        <button data-tab="intel">Intel</button>
        <button data-tab="cyber">Cyber · Space</button>
      </nav>
      <div class="tabbody" id="tabbody"></div>
      <div class="drawer" id="drawer" hidden></div>
    </aside>
  </main>

  <footer class="ticker"><div class="ticker-track" id="ticker"></div></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@6.0.2/dist/satellite.min.js"></script>
  <script src="data/geopolitics.js"></script>
  <script src="fx.js"></script>
  <script src="geo.js"></script>
  <script src="orbits.js"></script>
  <script src="globe.js"></script>
  <script src="app.js"></script>
</body>
</html>
